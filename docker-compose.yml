services:
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  api:
    build: .
    environment:
      NODE_ENV: production
      SERVICE_KIND: web
      PORT: 3000
      APP_BASE_URL: ${APP_BASE_URL:?APP_BASE_URL is required}
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:?APP_ENCRYPTION_KEY is required}
      APP_ENCRYPTION_KEYS: ${APP_ENCRYPTION_KEYS:-}
      APP_ENCRYPTION_KEY_VERSION: ${APP_ENCRYPTION_KEY_VERSION:-}
      DATABASE_APP_URL: ${DATABASE_APP_URL:?DATABASE_APP_URL is required}
      REDIS_URL: redis://redis:6379
      SENTRY_DSN: ${SENTRY_DSN:?SENTRY_DSN is required}
      SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0.1}
      SUPABASE_URL: ${SUPABASE_URL:?SUPABASE_URL is required}
      SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_PUBLISHABLE_KEY:?SUPABASE_PUBLISHABLE_KEY is required}
      VITE_TURNSTILE_SITE_KEY: ${VITE_TURNSTILE_SITE_KEY:?VITE_TURNSTILE_SITE_KEY is required}
      VITE_SENTRY_DSN: ${VITE_SENTRY_DSN:-}
      VITE_SENTRY_TRACES_SAMPLE_RATE: ${VITE_SENTRY_TRACES_SAMPLE_RATE:-0.1}
      VITE_RELEASE: ${VITE_RELEASE:-}
      GSC_CLIENT_ID: ${GSC_CLIENT_ID:-}
      GSC_CLIENT_SECRET: ${GSC_CLIENT_SECRET:-}
      GSC_STATE_SECRET: ${GSC_STATE_SECRET:-}
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-1}
    ports:
      - "3000:3000"
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build: .
    environment:
      NODE_ENV: production
      SERVICE_KIND: worker
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:?APP_ENCRYPTION_KEY is required}
      APP_ENCRYPTION_KEYS: ${APP_ENCRYPTION_KEYS:-}
      APP_ENCRYPTION_KEY_VERSION: ${APP_ENCRYPTION_KEY_VERSION:-}
      DATABASE_WORKER_URL: ${DATABASE_WORKER_URL:?DATABASE_WORKER_URL is required}
      REDIS_URL: redis://redis:6379
      SENTRY_DSN: ${SENTRY_DSN:?SENTRY_DSN is required}
      SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0.1}
      DATAFORSEO_LOGIN: ${DATAFORSEO_LOGIN:-}
      DATAFORSEO_PASSWORD: ${DATAFORSEO_PASSWORD:-}
      DEFAULT_SEO_LOCATION_CODE: ${DEFAULT_SEO_LOCATION_CODE:-2840}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-}
      GSC_CLIENT_ID: ${GSC_CLIENT_ID:-}
      GSC_CLIENT_SECRET: ${GSC_CLIENT_SECRET:-}
      TRONGRID_API_KEY: ${TRONGRID_API_KEY:-}
      TRC20_RECIPIENT_ADDRESS: ${TRC20_RECIPIENT_ADDRESS:-}
      TRC20_USDT_CONTRACT: ${TRC20_USDT_CONTRACT:-}
      PAYMENT_INTENT_MINUTES: ${PAYMENT_INTENT_MINUTES:-30}
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  redis-data:
