name: quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run prisma:validate
      - run: npm run prisma:generate
      - run: npm run lint
      - run: npm run test:coverage
      - run: npm run build
      - name: Audit production dependencies
        run: |
          for attempt in 1 2 3; do
            if npm audit --omit=dev --audit-level=high --fetch-retries=2 --fetch-timeout=60000; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            sleep $((attempt * 15))
          done
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  database:
    runs-on: ubuntu-latest
    needs: verify
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres?schema=public
      TURNSTILE_SECRET_KEY: 1x0000000000000000000000000000000AA
      SMTP_HOST: localhost
      SMTP_USER: test
      SMTP_PASSWORD: test
      SMTP_FROM_EMAIL: test@example.com
    services:
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npx --yes supabase@2.81.3 start
      - run: npx --yes supabase@2.81.3 db reset --local --no-seed
      - run: npx --yes supabase@2.81.3 db lint --local --level error
      - run: npx --yes supabase@2.81.3 test db --local
      - run: npm ci
      - run: npm run db:drift
      - run: npm run build
      - name: Start real Web and Worker processes against Supabase and Redis
        env:
          APP_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          REDIS_URL: redis://127.0.0.1:6379
          SENTRY_DSN: https://public@example.com/1
          APP_BASE_URL: http://127.0.0.1:4180
        run: |
          docker exec supabase_db_aiseo psql -U postgres -d postgres -v ON_ERROR_STOP=1 -c "ALTER ROLE app_backend LOGIN PASSWORD 'ci_backend_password'; ALTER ROLE app_worker LOGIN PASSWORD 'ci_worker_password';"
          SUPABASE_PUBLISHABLE_KEY=$(npx --yes supabase@2.81.3 status -o json | jq -r '.ANON_KEY')
          test -n "$SUPABASE_PUBLISHABLE_KEY"
          NODE_ENV=test SERVICE_KIND=worker DATABASE_WORKER_URL='postgresql://app_worker:ci_worker_password@127.0.0.1:54322/postgres?schema=public&sslmode=disable&connection_limit=2&pool_timeout=10&application_name=aiseo-ci-worker' node dist/entrypoint.cjs > worker.log 2>&1 &
          WORKER_PID=$!
          NODE_ENV=test SERVICE_KIND=web PORT=4180 DATABASE_APP_URL='postgresql://app_backend:ci_backend_password@127.0.0.1:54322/postgres?schema=public&sslmode=disable&connection_limit=2&pool_timeout=10&application_name=aiseo-ci-web' SUPABASE_URL='http://127.0.0.1:54321' SUPABASE_PUBLISHABLE_KEY="$SUPABASE_PUBLISHABLE_KEY" node dist/entrypoint.cjs > web.log 2>&1 &
          WEB_PID=$!
          trap 'kill "$WEB_PID" "$WORKER_PID" 2>/dev/null || true; cat web.log; cat worker.log' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4180/api/health/ready > ready.json; then
              jq -e '.data.status == "READY"' ready.json
              exit 0
            fi
            sleep 2
          done
          cat ready.json 2>/dev/null || true
          exit 1

  e2e:
    runs-on: ubuntu-latest
    needs: verify
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  container:
    runs-on: ubuntu-latest
    needs: [verify, database, e2e]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: aiseo:ci
      - run: docker run --rm --entrypoint node aiseo:ci --check dist/server.cjs
      - run: docker run --rm --entrypoint node aiseo:ci --check dist/worker.cjs
