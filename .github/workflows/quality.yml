name: quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run prisma:validate
      - run: npm run prisma:generate
      - run: npm run lint
      - run: npm run test:coverage
      - run: npm run build
      - name: Audit production dependencies
        run: |
          for attempt in 1 2 3; do
            if npm audit --omit=dev --audit-level=high --fetch-retries=2 --fetch-timeout=60000; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            sleep $((attempt * 15))
          done
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  database:
    runs-on: ubuntu-latest
    needs: verify
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres?schema=public
      TURNSTILE_SECRET_KEY: 1x0000000000000000000000000000000AA
      SMTP_HOST: localhost
      SMTP_USER: test
      SMTP_PASSWORD: test
      SMTP_FROM_EMAIL: test@example.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npx --yes supabase@2.81.3 start
      - run: npx --yes supabase@2.81.3 db reset --local --no-seed
      - run: npx --yes supabase@2.81.3 db lint --local --level error
      - run: npx --yes supabase@2.81.3 test db --local
      - run: npm ci
      - run: npm run db:drift

  container:
    runs-on: ubuntu-latest
    needs: [verify, database]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: aiseo:ci
      - run: docker run --rm --entrypoint node aiseo:ci --check dist/server.cjs
      - run: docker run --rm --entrypoint node aiseo:ci --check dist/worker.cjs
